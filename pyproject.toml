[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevspawn"
version = "0.1.0"
description = "Jev-style agentic inference over compositional action spaces"
requires-python = ">=3.12"
dependencies = [
    "torch==2.6.0",
    "transformers==5.15.1",
    "accelerate==1.14.0",
    "flash-linear-attention==0.5.2",
    "flash-attn==2.7.4.post1",
    "numpy==2.2.6",
    "triton==3.2.0",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_spawn = ["configs/*.json", "template/*.json"]
